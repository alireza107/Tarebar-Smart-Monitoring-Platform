services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tarebar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_VIDEO_ANALYTICS_API_URL: ${NEXT_PUBLIC_VIDEO_ANALYTICS_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MEDIAMTX_WEBRTC_URL: ${NEXT_PUBLIC_MEDIAMTX_WEBRTC_URL:-http://localhost:8889}
        NEXT_PUBLIC_MEDIAMTX_HLS_URL: ${NEXT_PUBLIC_MEDIAMTX_HLS_URL:-http://localhost:8888}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tarebar
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_MEDIAMTX_WEBRTC_URL: ${NEXT_PUBLIC_MEDIAMTX_WEBRTC_URL:-http://localhost:8889}
      NEXT_PUBLIC_MEDIAMTX_HLS_URL: ${NEXT_PUBLIC_MEDIAMTX_HLS_URL:-http://localhost:8888}
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      MEDIAMTX_API_URL: http://mediamtx:9997
      VIDEO_ANALYTICS_API_URL: http://video-analytics:8000
      ANALYTICS_READ_KEY: ${ANALYTICS_READ_KEY:-local-read-key-change-me}
    depends_on:
      db:
        condition: service_healthy
      mediamtx:
        condition: service_started
      video-analytics:
        condition: service_started

  mediamtx:
    image: bluenviron/mediamtx:1.18.2
    restart: unless-stopped
    ports:
      - "1935:1935"       # RTMP ingest (Larix)
      - "8554:8554"       # RTSP ingest/read (CV pipeline)
      - "8888:8888"       # Low-latency HLS fallback
      - "8889:8889"       # WebRTC HTTP/WHEP signaling
      - "8189:8189/udp"   # WebRTC ICE media
      - "127.0.0.1:9997:9997" # Control API; backend uses the Docker network
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOST:-localhost}
    volumes:
      - ./infrastructure/mediamtx.yml:/mediamtx.yml:ro

  video-analytics:
    build:
      context: ../video_analytics
    image: video-analytics-mvp:local
    init: true
    restart: unless-stopped
    ports:
      - "${VIDEO_ANALYTICS_PORT:-8000}:8000"
    environment:
      VIDEO_ANALYTICS_CORS_ORIGINS: ${VIDEO_ANALYTICS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      VIDEO_ANALYTICS_JOB_WORKERS: ${VIDEO_ANALYTICS_JOB_WORKERS:-2}
      VIDEO_ANALYTICS_PROCESSING_WIDTH: ${VIDEO_ANALYTICS_PROCESSING_WIDTH:-1280}
      VIDEO_ANALYTICS_FRAME_STRIDE: ${VIDEO_ANALYTICS_FRAME_STRIDE:-10}
      VIDEO_ANALYTICS_FLEET_ENABLED: ${VIDEO_ANALYTICS_FLEET_ENABLED:-true}
      VIDEO_ANALYTICS_FLEET_FPS: "0.5"
      VIDEO_ANALYTICS_FLEET_MAX_CAMERAS: ${VIDEO_ANALYTICS_FLEET_MAX_CAMERAS:-32}
      # Fleet/general dashboard tracker. Allowed: bytetrack, stabletrack, deepocsort, botsort.
      VIDEO_ANALYTICS_TRACKER: ${VIDEO_ANALYTICS_TRACKER:-stabletrack}
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tarebar
      ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@db:5432/tarebar
      ANALYTICS_READ_KEY: ${ANALYTICS_READ_KEY:-local-read-key-change-me}
      ANALYTICS_INGEST_KEY: ${ANALYTICS_INGEST_KEY:-local-ingest-key-change-me}
      VIDEO_ANALYTICS_INGEST_URL: http://127.0.0.1:8000/api/v1/ingest/minutes
      ANALYTICS_OUTBOX_DIR: /app/output/outbox
      ANALYTICS_EXPECTED_SAMPLES_PER_MINUTE: ${ANALYTICS_EXPECTED_SAMPLES_PER_MINUTE:-30}
      ANALYTICS_PUBLISH_INTERVAL_SECONDS: ${ANALYTICS_PUBLISH_INTERVAL_SECONDS:-10}
      ANALYTICS_ROLLUP_INTERVAL_SECONDS: ${ANALYTICS_ROLLUP_INTERVAL_SECONDS:-15}
      VIDEO_ANALYTICS_SPATIAL_PUBLISH_SECONDS: ${VIDEO_ANALYTICS_SPATIAL_PUBLISH_SECONDS:-30}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Asia/Tehran}
    volumes:
      - analytics-jobs:/app/output/dashboard
      - analytics-outbox:/app/output/outbox
      - ../video_analytics/outputs/synthetic:/app/outputs/synthetic:ro
    depends_on:
      db:
        condition: service_healthy
      mediamtx:
        condition: service_started

volumes:
  pgdata:
  analytics-jobs:
  analytics-outbox:
